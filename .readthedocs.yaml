# The documentation is hosted on GitHub Pages (.github/workflows/docs.yml):
# https://dotrungthai2001.github.io/patminton/
# Read the Docs only serves a page that forwards old patminton.readthedocs.io
# links there, such as those on the PyPI page of releases up to 0.1.1.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp docs/rtd-redirect.html $READTHEDOCS_OUTPUT/html/index.html
    # Served for every missing page, so deep links are forwarded too.
    - cp docs/rtd-redirect.html $READTHEDOCS_OUTPUT/html/404.html

site_name: patminton
site_description: GPU-accelerated forward and adjoint operators for 3D photoacoustic tomography
site_url: https://patminton.readthedocs.io/
repo_url: https://github.com/dotrungthai2001/patminton
copyright: Copyright &copy; 2026 the patminton authors

theme:
  name: material
  logo: assets/logo-mark.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Background:
      - Overview: background.md
      - Physical and mathematical model: theory.md
      - Transducer models: transducer-models.md
      - Reconstruction algorithms: solvers.md
      - Key parameters: parameters.md

exclude_docs: |
  requirements.txt
  assets/logo-source.jpg

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patminton"
version = "0.1.1"
description = "Scalable GPU forward and adjoint operators for 3D photoacoustic tomography that model the transducer spatial impulse response"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
# Names only: an author given with an email is moved to the Author-email field
# and left out of the Author field that PyPI displays.
authors = [
    { name = "Trung-Thai Do" },
    { name = "Paul Escande" },
    { name = "Caroline Chaux" },
    { name = "Jérôme Gateau" },
    { name = "Hwee Kuan Lee" },
]
maintainers = [
    { name = "Trung-Thai Do", email = "trungthai1771@gmail.com" },
]
keywords = ["photoacoustic", "tomography", "CUDA", "inverse-problems", "imaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "torch",
    # libcufft.so.11 for the prebuilt wheel (CUDA 12.8). The default PyTorch
    # wheel ships only libcufft.so.12 (CUDA 13).
    "nvidia-cufft-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Documentation = "https://patminton.readthedocs.io/"
Source = "https://github.com/dotrungthai2001/patminton"

[project.optional-dependencies]
# libpat_gpu.so links dynamically against libcufft. For a build from source,
# the CUDA toolkit provides it; these extras pull it from PyPI instead when the
# toolkit's copy is not on the loader path. Pick the extra matching the CUDA
# major version of the nvcc used for the build.
cuda12 = [
    "nvidia-cufft-cu12",
]
cuda13 = [
    "nvidia-cufft>=12",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patminton = ["cuda/**/*.cu", "cuda/**/*.cuh", "cuda/**/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU and the compiled libpat_gpu.so (deselect with '-m \"not gpu\"')",
]
